  <line x1="520" y1="150" x2="520" y2="290" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="435" y1="205" x2="575" y2="205" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <!-- Text readouts -->
  <text x="350" y="145" font-family="monospace" font-size="11" fill="#06b6d4">LOC: +49.1 uA (+0.65 dots)</text>
  <text x="350" y="165" font-family="monospace" font-size="11" fill="#10b981">G/S: +50.9 uA (+0.68 dots)</text>
  <text x="520" y="145" font-family="monospace" font-size="11" fill="#a855f7">FAS CRC: 0x3DB5BC03</text>

  <text x="335" y="350" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">ARINC 429 BUS WORDS (ATTACHMENT 2)</text>
  <rect x="335" y="370" width="340" height="185" rx="4" fill="#090e18" stroke="#1e293b"/>
  <text x="350" y="395" font-family="monospace" font-size="11" fill="#38bdf8">173 LOC DEVIATION: 0x680000DE (ODD PARITY)</text>
  <text x="350" y="425" font-family="monospace" font-size="11" fill="#10b981">174 G/S DEVIATION: 0x680000EE (ODD PARITY)</text>
  <text x="350" y="455" font-family="monospace" font-size="11" fill="#a855f7">270 MMR STATUS   : 0x830000B8 (AUTOLAND OK)</text>
  <text x="350" y="485" font-family="monospace" font-size="11" fill="#f59e0b">027 GLS CH TUNING: 0x805047E7 (CH 20455)</text>
  <text x="350" y="515" font-family="monospace" font-size="11" fill="#cbd5e1">060 DME RANGE    : 0x801A0030 (4.2 NM)</text>

  <!-- Right Panel: Auditor -->
  <rect x="710" y="70" width="270" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="725" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">10-POINT NORMATIVE AUDIT</text>

  <g transform="translate(725, 120)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. ARINC 429 Bit 32 Parity</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 160)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Label Bit-Reversal</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 200)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. DO-253D FAS CRC-32</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 240)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">4. BNR Deflection (±150 uA)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 280)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">5. Cat-I (LAL 40m / VAL 35m)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 320)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">6. Cat-II (LAL 17m / VAL 10m)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 360)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">7. Cat-III (LAL 10.7m / VAL 5.3m)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 400)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">8. VDB D8PSK Multiplexing</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 440)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">9. SSM Normal State (11b)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 480)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">10. PFD Autoland Interop</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
