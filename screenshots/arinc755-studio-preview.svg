<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#studioBg)"/>

  <!-- Window Header -->
  <rect width="1000" height="50" fill="#111827" stroke="#1f293d" stroke-width="1"/>
  <circle cx="25" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="31" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    ARINC755Forge Pro — Multi-Mode Receiver &amp; GBAS/GLS Landing Studio (v1.0.0)
  </text>
  <rect x="730" y="14" width="245" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
  <text x="852" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">
    GLS CAT-III AUTOLAND AUTHORIZED
  </text>

  <!-- Left Panel: Controls -->
  <rect x="20" y="70" width="280" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="35" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">APPROACH &amp; VDB CONFIG</text>

  <rect x="35" y="120" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="142" font-family="sans-serif" font-size="12" fill="#e2e8f0">Category: GBAS Cat-III Autoland</text>

  <rect x="35" y="170" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="192" font-family="sans-serif" font-size="12" fill="#e2e8f0">Airport/Runway: OMDB RW12L</text>

  <rect x="35" y="220" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="242" font-family="sans-serif" font-size="12" fill="#e2e8f0">GLS Channel: 20455 (108.35 MHz)</text>

  <rect x="35" y="270" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="292" font-family="sans-serif" font-size="12" fill="#e2e8f0">Glidepath: 3.00° | TCH: 50.0 ft</text>

  <rect x="35" y="320" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="342" font-family="sans-serif" font-size="12" fill="#e2e8f0">Dev: Lat +3.5m | Vert +1.8m</text>

  <rect x="35" y="380" width="250" height="40" rx="4" fill="#06b6d4"/>
  <text x="160" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">
    UPDATE GUIDANCE
  </text>

  <!-- Center Panel: Cross-Pointer CDI & Bus Words -->
  <rect x="320" y="70" width="370" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="335" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">PFD FLIGHT DIRECTOR &amp; CROSS-POINTER</text>

  <rect x="335" y="120" width="340" height="200" rx="4" fill="#060911" stroke="#1e293b"/>
  <!-- Horizon & Scale -->
  <circle cx="505" cy="220" r="80" fill="none" stroke="#1f293d" stroke-width="2"/>
  <circle cx="505" cy="220" r="4" fill="#ffffff"/>
  <!-- CDI Dots -->
  <circle cx="450" cy="220" r="3" fill="#475569"/>
  <circle cx="477" cy="220" r="3" fill="#475569"/>
  <circle cx="533" cy="220" r="3" fill="#475569"/>
  <circle cx="560" cy="220" r="3" fill="#475569"/>
  <circle cx="505" cy="165" r="3" fill="#475569"/>
  <circle cx="505" cy="192" r="3" fill="#475569"/>
  <circle cx="505" cy="248" r="3" fill="#475569"/>
  <circle cx="505" cy="275" r="3" fill="#475569"/>
